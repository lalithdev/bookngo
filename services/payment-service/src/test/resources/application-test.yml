server:
  port: 0

spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable .env file import in tests
  config:
    import: ""

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: test-secret-key-for-payment-service-tests-at-least-32-chars
    expiration-ms: 86400000
  payment:
    simulation-enabled: true
    provider-secret-key: test-provider-secret
    signature-validation-enabled: false

services:
  booking-service:
    url: http://localhost:9999
